name: Build & Publish NuGet Packages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack all packages
      run: |
        mkdir -p ./artifacts
        dotnet pack src/Olbrasoft.Text.Transformation.Markdown/Olbrasoft.Text.Transformation.Markdown.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Transformation.Abstractions/Olbrasoft.Text.Transformation.Abstractions.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Transformation/Olbrasoft.Text.Transformation.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Transformation.Cohere/Olbrasoft.Text.Transformation.Cohere.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Transformation.OpenAICompatible/Olbrasoft.Text.Transformation.OpenAICompatible.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Translation.Abstractions/Olbrasoft.Text.Translation.Abstractions.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Translation.Azure/Olbrasoft.Text.Translation.Azure.csproj --configuration Release --no-build --output ./artifacts
        dotnet pack src/Olbrasoft.Text.Translation.DeepL/Olbrasoft.Text.Translation.DeepL.csproj --configuration Release --no-build --output ./artifacts

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --source https://api.nuget.org/v3/index.json \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --skip-duplicate
